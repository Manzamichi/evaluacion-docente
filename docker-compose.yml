services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: evaluacion_docente_web
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/apache-vhost.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      DB_HOST: db
      DB_NAME: evaluacion_docente
      DB_USER: app_user
      DB_PASS: app_password
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evaluacion_docente_network

  db:
    image: mysql:8.4
    container_name: evaluacion_docente_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: evaluacion_docente
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evaluacion_docente_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: evaluacion_docente_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evaluacion_docente_network

networks:
  evaluacion_docente_network:
    driver: bridge

volumes:
  db_data:
